# ChartNagari 설정 파일 템플릿
# 이 파일을 복사하여 config/settings.yaml 로 저장하고 값을 채워주세요.
# settings.yaml 은 .gitignore 에 등록되어 있으므로 절대 커밋되지 않습니다.
#
# 신규 설치용. 기존 설치는 복사하지 말고 서버 최초 시작 시 자동 이전을 사용하세요.
# version: 1 이후에는 .env/OS 환경변수가 이 파일을 덮어쓰지 않습니다.
version: 1

server:
  env: development          # development | production
  host: "127.0.0.1"        # Docker에서는 0.0.0.0으로 변경 (호스트 포트는 루프백만 노출)
  api_token: ""
  port: "8080"
  log_level: debug          # debug | info | warn | error

database:
  path: ./data/chart_analyzer.db

# ── Binance (크립토 데이터) ──────────────────────────────────────────────────
binance:
  api_key: ""
  secret_key: ""

# ── Tiingo (주식 데이터 — 권장) ─────────────────────────────────────────────
# 무료 계정: https://www.tiingo.com → Account → API → Create Token
tiingo:
  api_key: ""
  poll_interval: 900        # 초 단위. 무료 플랜: 50 req/hr → 900 권장

# ── Yahoo Finance (주식 데이터 — Tiingo 미설정 시 폴백) ───────────────────
yahoo:
  poll_interval: 60         # 초 단위

# ── Telegram Bot ─────────────────────────────────────────────────────────────
telegram:
  bot_token: ""
  chat_id: ""

# ── Discord Webhook ──────────────────────────────────────────────────────────
discord:
  webhook_url: ""

# ── 알림 설정 ────────────────────────────────────────────────────────────────
alert:
  cooldown_hours: 4

# ── LLM 해석 레이어 ──────────────────────────────────────────────────────────
llm:
  provider: ""              # anthropic | openai | groq | gemini (비어있으면 자동 선택)
  language: en              # en | ko | ja
  min_score: 12.0           # AI 해석을 트리거하는 최소 시그널 점수

anthropic:
  api_key: ""

openai:
  api_key: ""

groq:
  api_key: ""

gemini:
  api_key: ""

ollama:
  host: http://localhost:11434
  model: gemma4:4b
  timeout_sec: 120

# 별도 실행되는 MCP/Alpaca 프로세스도 동일한 YAML을 읽습니다.
# 웹에서 저장해도 주문 실행기가 시작되거나 활성화되지는 않습니다.
clients:
  CHARTNAGARI_URL: http://localhost:8080
  CHARTNAGARI_TOKEN: ""
  ALPACA_API_URL: https://paper-api.alpaca.markets
  ALPACA_API_KEY: ""
  ALPACA_API_SECRET: ""
  CHARTNAGARI_FEEDBACK_URL: ""
  CHARTNAGARI_PLUGIN_SECRET: ""
  CHARTNAGARI_PLUGIN_ID: alpaca-paper
  LISTEN_ADDR: ":9100"
  ALPACA_DB_PATH: ./plugin-alpaca.db
  ALPACA_NOTIONAL_PER_TRADE: "1000"
  ALPACA_TIMESTAMP_SKEW_SEC: "300"

# ── AlphaVantage (선택 — 20년 일봉 SPY 데이터) ──────────────────────────────
alphavantage:
  api_key: ""

# ── 경제 캘린더 (둘 중 하나만 설정하면 됨) ───────────────────────────────────
# FMP가 설정되어 있으면 FMP 우선 사용, 없으면 Finnhub 사용

# Financial Modeling Prep (무료 플랜 포함 — 권장)
# 무료 계정: https://financialmodelingprep.com → Dashboard → API Keys
fmp:
  api_key: ""

# Finnhub (유료 플랜 필요 — /calendar/economic은 무료 플랜 미지원)
# https://finnhub.io → Dashboard → API Keys
finnhub:
  api_key: ""
  # 고임팩트 경제 이벤트 사전 알림 + 신호 알림 매크로 주석에 사용하는 선행 시간(분).
  # 허용 범위 5–1440, 기본값 30. 범위를 벗어나면 가까운 경계값으로 자동 보정됨.
  alert_window_minutes: 30
