services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chart-analyzer
    restart: unless-stopped
    ports:
      # 호스트 루프백으로만 노출 (LAN 차단). 컨테이너 내부는 0.0.0.0 바인딩.
      - "127.0.0.1:8080:8080"
    volumes:
      # SQLite DB 영속화
      - ./data:/app/data
      # 설정 파일 (UI에서 알림/리포트/룰 등 저장 시 쓰기 필요)
      - ./config:/app/config
      # 프론트엔드 (restart.sh에서 npm run build 후 마운트)
      - ./web/dist:/app/web/dist:ro
    # config/settings.yaml: server.host=0.0.0.0, server.port="8080"
    # database.path=./data/chart_analyzer.db (container cwd=/app)
    # Existing .env users: migrate on the host before starting this container.
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  data:
